[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gf-factor-agent"
version = "0.1.0"
description = "GF A-share factor research agent"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
gf-factor-agent = "rdagent.app.cli:app"

[tool.setuptools.packages.find]
include = ["rdagent*"]

[tool.setuptools.package-data]
rdagent = ["**/*.yaml", "**/*.txt", "**/*.md"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["test"]
markers = [
    "slow: end-to-end strategy runs (worker round-trips, full backtests, benchmark calibration). Deselect with -m \"not slow\".",
]

[tool.ruff]
line-length = 120
src = ["rdagent", "scripts"]

[tool.ruff.lint]
ignore = ["ANN401", "D", "S101", "T20"]
select = ["E", "F", "I", "UP"]
